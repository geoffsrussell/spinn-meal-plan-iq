[build]
  command = "npm run build"
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/kroger/locations"
  to = "/.netlify/functions/locations"
  status = 200

[[redirects]]
  from = "/api/kroger/products"
  to = "/.netlify/functions/products"
  status = 200

[[redirects]]
  from = "/api/kroger/auth/start"
  to = "/.netlify/functions/auth-start"
  status = 200

[[redirects]]
  from = "/api/kroger/auth/callback"
  to = "/.netlify/functions/auth-callback"
  status = 200

[[redirects]]
  from = "/api/kroger/auth/status"
  to = "/.netlify/functions/auth-status"
  status = 200

[[redirects]]
  from = "/api/kroger/auth/logout"
  to = "/.netlify/functions/auth-logout"
  status = 200

[[redirects]]
  from = "/api/kroger/cart"
  to = "/.netlify/functions/cart"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
